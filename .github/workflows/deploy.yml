name: Deploy to cPanel
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.APP_PATH }}
            git pull origin main
            tar cf - -C backend --exclude='tmp' --exclude='venv' --exclude='database.db' . | tar xf - -C ${{ secrets.DEPLOY_TARGET_PATH }}
            source ${{ secrets.VENV_PATH }}/bin/activate
            pip install -r ${{ secrets.DEPLOY_TARGET_PATH }}/requirements.txt
            touch ${{ secrets.DEPLOY_TARGET_PATH }}/tmp/restart.txt
